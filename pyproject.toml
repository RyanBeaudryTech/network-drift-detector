[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-drift-detector"
version = "0.1.0"
description = "A network automation tool that detects meaningful configuration drift from device snapshots"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "scrapli>=2025.1.30",
    "rich>=14.2.0",
    "PyYAML>=6.0.3",
    "scrapli_community>=2025.1.30",
    "regex>=2021.9.30",
    "ssh2-python>=1.2.0.post1"
]

[tool.setuptools]
py-modules = [
    "drift_detector_v2",
    "diff_utils_v2",
    "device_poller_v2"
]